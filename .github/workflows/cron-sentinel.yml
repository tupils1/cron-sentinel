# Runs this repo's action via `uses: ./` ( @v1 is not released ).
# `schedule` fires only on the default branch. `push` (non-main) and
# `workflow_dispatch` run it on a branch so the result can be checked
# against the real Actions runs API before merge.
name: cron-sentinel
on:
  schedule:
    # A few minutes after schedule-canary's */15 slots (0, 15, 30, 45).
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
  push:
    branches-ignore: [main]
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: sentinel
        uses: ./
        with:
          dry-run: 'true'
          # Empty min-consecutive-misses: 3 for the */15 canary, 1 otherwise.
          grace-minutes: '5'
          delay-threshold-minutes: '5'
          lookback-minutes: '1440'
          inactivity-warn-days: '45'
      - name: outputs
        run: |
          echo "workflows-checked=${{ steps.sentinel.outputs.workflows-checked }}"
          echo "problems=${{ steps.sentinel.outputs.problems }}"
          echo "issues=${{ steps.sentinel.outputs.issues }}"
          echo "reruns=${{ steps.sentinel.outputs.reruns }}"
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: sentinel
        uses: ./
        with:
          dry-run: 'false'
          # 1 so a single aged miss still opens an issue. The dry-run job
          # leaves this empty and shows the sub-hourly default of 3.
          min-consecutive-misses: '1'
          grace-minutes: '5'
          delay-threshold-minutes: '5'
          lookback-minutes: '1440'
          # 0 forces the 60-day warning path on a repository that still has recent commits.
          inactivity-warn-days: '0'
      - name: outputs
        run: |
          echo "workflows-checked=${{ steps.sentinel.outputs.workflows-checked }}"
          echo "problems=${{ steps.sentinel.outputs.problems }}"
          echo "issues=${{ steps.sentinel.outputs.issues }}"
          echo "reruns=${{ steps.sentinel.outputs.reruns }}"
