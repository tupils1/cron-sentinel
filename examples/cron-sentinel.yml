# Copy to .github/workflows/cron-sentinel.yml
# @v1 is not released yet (no git tag, GitHub Release, or Marketplace listing).
# Until that ref exists, checkout this repo and use `uses: ./` instead.
name: cron-sentinel
on:
  schedule:
    - cron: '7,37 * * * *'   # off the top of the hour; ideally also trigger externally (see README)
  workflow_dispatch:
permissions:
  actions: read      # use `write` only with rerun-on-incident: true
  contents: read
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: tupils1/cron-sentinel@v1
        # with:
        #   min-consecutive-misses: '3'  # empty = 3 above hourly, 1 otherwise. Dispatch runs are not backfill.
