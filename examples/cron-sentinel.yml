# Copy to .github/workflows/cron-sentinel.yml
name: cron-sentinel
on:
  schedule:
    - cron: '7,37 * * * *'   # off the top of the hour; ideally also trigger externally (see README)
  workflow_dispatch:
permissions:
  actions: read      # use `write` only with rerun-on-incident: true
  contents: read
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: tupils1/cron-sentinel@v0
